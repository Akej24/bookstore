version: '3'
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: bookstore_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3308:3306"
    volumes:
      - bookstore-mysql:/var/lib/mysql
    networks:
      - bookstore-network
    container_name: mysql

  redis:
    image: redis:7.0
    hostname: localhost
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - bookstore-redis:/data
    networks:
      - bookstore-network
    container_name: redis

  rabbitmq:
    image: rabbitmq:3.12.0-rc.2-management
    hostname: localhost
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - bookstore-rabbitmq:/var/lib/rabbitmq
    networks:
      - bookstore-network
    container_name: rabbitmq

  react:
    build:
      context: ../../bookstore-frontend
      dockerfile: ../bookstore-frontend/Dockerfile
    hostname: localhost
    restart: always
    ports:
      - "3002:3000"
    networks:
      - bookstore-network
    container_name: react

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      REDIS_URL: redis://redis:6381/0
      MYSQL_HOST: mysql://mysql:3308/bookstore_db
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - react
    networks:
      - bookstore-network
    container_name: app

networks:
  bookstore-network:
    driver: bridge

volumes:
  bookstore-mysql:
  bookstore-redis:
  bookstore-rabbitmq:

#docker-compose up